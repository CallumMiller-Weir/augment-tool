name: CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  node-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Updated to currently active LTS versions (18.x and 20.x are now EOL)
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: yarn run-tests

  rust-check:
    runs-on: ubuntu-latest

    # The Rust crate lives in src-tauri/, not the repo root.
    defaults:
      run:
        working-directory: src-tauri

    steps:
    - uses: actions/checkout@v6
    # Tauri links against WebKitGTK and friends on Linux, so clippy and test
    # can't compile without them. List from https://tauri.app/start/prerequisites/
    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - name: Check formatting
      run: cargo fmt --check
    - name: Run Clippy
      run: cargo clippy -- -D warnings
    - name: Run tests
      run: cargo test
